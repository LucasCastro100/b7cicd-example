name: CI

# INICIANDO O WORKFLOW DE INTEGRAÇÃO CONTÍNUA (CI) PARA O REPOSITÓRIO
on:
  # push:
  #   branches: 
  #     - main
  #     - develop

  pull_request:
    branches: 
      - develop
  
  # O workflow será executado apenas quando houver alterações nos arquivos dentro das pastas src e tests
    paths: 
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'tsconfig.json'

  # Ignorando alterações em arquivos que não afetam a execução dos testes e build
    # paths-ignore:
    #   - 'README.md'
    #   - 'docs/**'
    #   - 'scripts/**'
    #   - 'tests/data/**'
    #   - 'tests/mocks/**'


jobs:
  # AQUI VAI OS JOB, QUE SERÁ EXECUTADO EM UMA MÁQUINA VIRTUAL UBUNTU
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # aqui estamos usando a action oficial do pnpm para instalar o pnpm na máquina virtual

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

  # deploy:
  #   runs-on: ubuntu-latest
  #   needs: [test, build]
  #   steps:
  #     - name: Deploy out code
  #       uses: actions/deploy
