name: CI

# INICIANDO O WORKFLOW DE INTEGRAÇÃO CONTÍNUA (CI) PARA O REPOSITÓRIO
on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [develop]

jobs:
  # AQUI VAI OS JOB, QUE SERÁ EXECUTADO EM UMA MÁQUINA VIRTUAL UBUNTU
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

